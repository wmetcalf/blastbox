[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blastbox"
version = "0.1.40"
description = "Reusable detonation framework: run untrusted documents through disposable, hardened workers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Will Metcalf" }]
keywords = ["sandbox", "malware", "detonation", "untrusted", "document", "isolation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Core depends on pydantic ONLY. This is everything an *engine* needs — the
# typed contract + the worker SDK (engine seam, harness, sandbox, warm
# protocol). An engine adapter installs `blastbox` and stays lean.
dependencies = [
    "pydantic>=2.6.0",
    # PEP 440 semantics, in the one place they cannot be approximated: a pin of
    # `0.2.0-rc1` is normalised by the installer to `0.2.0rc1`, so a stamp that
    # records the source spelling and compares it literally against
    # `importlib.metadata.version()` fails verification for a build that is
    # entirely correct. The adopter engines' build wrappers already require
    # this to be importable from blastbox's environment for their version
    # floor; declaring it makes that true rather than hoped for.
    "packaging>=23.0",
]

[project.optional-dependencies]
# The host orchestrator (ingress API + CLI, dispatcher, pool, runtime,
# jobstores, observability). A host deployment installs `blastbox[host]`.
host = [
    "fastapi>=0.115.0",          # pairs with starlette>=0.40 (older fastapi pins starlette<0.37)
    "starlette>=0.40.0",         # imported directly (middleware.py); >=0.40 fixes the multipart DoS
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.18",  # CVE-2024-53981 (boundary-deformation DoS on the upload path)
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "psycopg[binary,pool]>=3.2",  # [pool] -> psycopg-pool, imported by SqlJobStore for Postgres
    "redis>=5.0",
    "pyzipper>=0.3.6",            # AES-256 result ZIPs (the 'infected' malware-handling convention)
    "cryptography>=42",           # worker-mTLS PKI: blastbox.host.pki (CA + cert issuance)
]
# Object-storage backend (MinIO / AWS S3) for multi-node deployments. NOT required
# by `blastbox[host]`: BLASTBOX_BLOB_URL unset uses the local filesystem and never
# imports boto3.
s3 = [
    "boto3>=1.34",
]
# The ClamAV engine's clamd client. Lives in the WORKER image, not the host: the daemon
# is a unix socket inside the guest, so nothing on the host ever imports this.
clamav = [
    "clamd>=1.0.2",
]
# The Magika content-type engine (model + onnxruntime). Worker-image only, like clamav —
# nothing on the host imports it.
magika = [
    "magika>=1.0.0",
]
dev = [
    "blastbox[host]",              # the http/ingress tests need the host stack (fastapi, etc.)
    "blastbox[clamav]",
    # magika too, and for the same reason. Without it tests/engines/test_magika.py's
    # `live` block skips silently in CI, so the model-loading path — the _MAGIKA
    # singleton, the identify() wrapper, onnxruntime version handling — is never
    # executed by anything, and the asymmetry is invisible in "N passed / M skipped".
    "blastbox[magika]",
    "pytest>=8.0.0",
    "mypy>=1.9.0",
    # 0.16 expanded ruff's default rule set -> 244 pre-existing violations across the
    # codebase; pin below it until a deliberate lint-modernization pass.
    "ruff>=0.3.0,<0.16",
    "fakeredis>=2.21",
    "httpx>=0.27",
    "moto[s3]>=5.0",             # in-process S3 for the blob-store contract tests
]

[project.urls]
Homepage = "https://github.com/wmetcalf/blastbox"
Repository = "https://github.com/wmetcalf/blastbox"
Issues = "https://github.com/wmetcalf/blastbox/issues"

[project.scripts]
blastbox = "blastbox.host.cli:main"
blastbox-netd = "blastbox.host.netd:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: ship the typing marker so consumers (e.g. ClippyShot) get types.
blastbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = [
    "integration: needs sandbox + soffice (run in the image)",
    "docker: exercises the built Docker image",
    "perf: performance benchmark gate; needs a benchmarkable host (skipped otherwise)",
]

[tool.ruff.lint]
# AGENTS.md mandates snake_case, and nothing enforced it (#168). N802 (function names) and N806
# (variables in functions) are the codes that say exactly that; the rest of pep8-naming is opinion
# this repo has not adopted and would churn deliberate names:
#   * N818 wants every exception to end in `Error` -- `SandboxUnavailable`,
#     `InsecureRuntimeRefused` and `DriftDetected` read better and were chosen.
#   * N811/N812/N814/N817 are import-alias conventions, unrelated to the rule in AGENTS.md.
# Selected additively so the default E/F set stays on.
extend-select = ["N802", "N806"]

[tool.ruff.lint.per-file-ignores]
# The shouted words in test names are DELIBERATE emphasis and carry meaning --
# `test_a_DECLARED_artifact_is_never_silently_skipped` says which half of the contract is under
# test. Enforcing N802 here would rename ~70 tests to satisfy a linter by deleting information.
# The rule applies to production code, which is where the AGENTS.md convention matters.
"tests/**" = ["E402", "N802", "N806"]
# E402 in tests is CORRECT, not debt. `pytest.importorskip("boto3")` has to run BEFORE the
# imports it guards, otherwise the module raises at collection time on any machine without the
# optional dependency instead of skipping. Moving those imports to the top would break the skip.

