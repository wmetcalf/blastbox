# Signature feeds — the CAPE box's set, minus securiteinfo.
#
# SECURITEINFO IS OMITTED DELIBERATELY. It is a PAID subscription and its URLs embed the
# licence key in the path, so copying them here would put a credential in the repository
# and share one subscription across deployments. A deployment that holds its own licence
# adds its own `DatabaseCustomURL` lines; nothing here needs changing for it to work.
#
# Everything else is free and public, and it is most of what makes ClamAV useful on real
# mail and web samples — stock ClamAV alone misses a great deal of phishing and spam
# tooling that these feeds carry.
DatabaseOwner clamav
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
ScriptedUpdates yes
CompressLocalDatabase no
TestDatabases yes
Bytecode true
MaxAttempts 5
ConnectTimeout 30
ReceiveTimeout 0
# Twice an hour, as on CAPE. Signature freshness IS part of the verdict — the driver
# reports the database version with every scan for exactly that reason.
Checks 10
NotifyClamd /etc/clamav/clamd.conf
LogTime true
LogFileMaxSize 0
LogVerbose false

# --- SaneSecurity: phishing, scams, junk, rogue AV --------------------------------
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/junk.ndb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/jurlbl.ndb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/phish.ndb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/rogue.hdb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/sanesecurity.ftm
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/scam.ndb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/sigwhitelist.ign2
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/spamattach.hdb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/spamimg.hdb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/winnow.attachments.hdb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/winnow_bad_cw.hdb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/winnow_extended_malware.hdb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/winnow_malware.hdb
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/winnow_malware_links.ndb
# `spam_marketing.ndb` IS DELIBERATELY ABSENT. CAPE has it on disk, but the SaneSecurity
# mirror 404s for it — it was retired from the public feed. Carrying a URL that does not
# resolve costs a failed fetch and a WARNING on every freshclam run, twice an hour,
# forever; and a log full of routine warnings is a log nobody reads when a real one
# arrives. Every other URL in this file was verified to answer before it was written down.
DatabaseCustomURL http://ftp.swin.edu.au/sanesecurity/blurl.ndb
