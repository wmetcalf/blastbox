# ClamAV signature scanning inside a blastbox worker guest. Matched to the CAPE box
# (172.18.101.17) so a sample scanned here and a sample scanned there get the same
# answer. A detection engine whose config drifts from the one it is compared against
# produces "coverage differences" that are really configuration differences, and
# `reconcile` would attribute them to the engine.
#
# A UNIX SOCKET, NOT TCP. The daemon is a private detail of ONE SLOT, not a service:
# it is reachable only by the worker process sharing the guest, so there is no port to
# firewall, no cross-tenant reachability question, and nothing to authenticate. An
# earlier draft ran it as a shared TCP sidecar that the Loadout API talked to directly
# — which put the scanner outside the execution substrate and bypassed the signed-job /
# sealed-envelope path in ADR-002 entirely.

LocalSocket /run/clamav/clamd.ctl
LocalSocketMode 660

FixStaleSocket true
User clamav
Foreground true

# --- what gets unpacked and looked inside ---------------------------------------
ScanMail true
ScanArchive true
# ENCRYPTED ARCHIVES ARE NOT BLOCKED, matching CAPE. A password-protected zip is the
# commonest way a real sample arrives, and refusing it outright would refuse the job.
# It is reported as unscannable rather than clean by the driver.
ArchiveBlockEncrypted false
ScanPE true
ScanELF true
ScanOLE2 true
ScanPDF true
ScanHTML true
ScanSWF true
ScanXMLDOCS true
ScanHWP3 true
AlgorithmicDetection true
DetectBrokenExecutables false
ExtendedDetectionInfo true

# --- the limits, verbatim from CAPE ----------------------------------------------
# These decide what "clean" means: a file over MaxFileSize is NOT SCANNED, and a scanner
# that reports clean on a file it declined to read is the false negative this whole
# engine rewrite was about. The driver reads them back and says so.
MaxFileSize 25M
MaxScanSize 100M
MaxFiles 10000
MaxRecursion 16
MaxDirectoryRecursion 15
MaxPartitions 50
MaxIconsPE 100
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxRecHWP3 16
StreamMaxLength 25M
PCREMatchLimit 10000
PCRERecMatchLimit 5000
PCREMaxFileSize 25M

FollowDirectorySymlinks false
FollowFileSymlinks false
ReadTimeout 180
MaxThreads 12
MaxConnectionQueueLength 15
SelfCheck 3600
ExitOnOOM false
LeaveTemporaryFiles false

# THIRD-PARTY SIGNATURES ARE THE POINT. `OfficialDatabaseOnly false` is what lets the
# SaneSecurity / urlhaus / winnow feeds below load at all — with it true, clamd ignores
# every custom database and the engine quietly becomes stock ClamAV.
OfficialDatabaseOnly false
DatabaseDirectory /var/lib/clamav

LogTime true
LogClean false
LogVerbose false
LogFileMaxSize 0
