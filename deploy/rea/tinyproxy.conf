# rea-model-proxy: the ONLY egress of a `rea-agent` slot (deploy/rea/README.md "Network").
#
# The worker sits on the --internal bridge bb-rea-model with HTTP(S)_PROXY pointing here. This
# proxy is dual-homed (bb-rea-model + an egress bridge) and forwards exactly one thing: plain
# HTTP to the DeepSeek vLLM endpoint http://172.18.101.13:8888/. Everything else is refused.
#
# tinyproxy 1.11.3 (kalaksi/tinyproxy, pinned by digest in compose.yml).

# The image runs tinyproxy as its own non-root uid (57981); no User/Group switch.
Port 8888
# Listen on the bb-rea-model address only: nothing on the egress side can use this proxy.
Listen 10.231.200.2
Timeout 600
MaxClients 16
LogLevel Info
# Logs to stderr (docker logs), no LogFile.

# Only the internal bridge may talk to it.
Allow 10.231.200.0/24

# No identifying or hop headers added to upstream requests.
DisableViaHeader Yes
XTinyproxy No

# Default-deny URL filter. FilterURLs matches the regex against the FULL request URL
# (scheme://host:port/path) instead of the bare host, which lets the filter pin the PORT too:
# a host-only filter (^172\.18\.101\.13$) would let a slot reach ANY port on the model host.
# The trailing "/" stops "http://172.18.101.13:8888@evil/" userinfo tricks: tinyproxy connects
# to the host after "@", but the filter needs "/" right after 8888.
Filter "/etc/tinyproxy/filter"
FilterURLs On
FilterType ERE
FilterCaseSensitive Yes
FilterDefaultDeny Yes

# CONNECT. With no ConnectPort line tinyproxy allows CONNECT to ANY port. One ConnectPort entry
# turns the list into an allowlist; port 1 (tcpmux) is never the model port, so every CONNECT
# is refused here (403) before the filter is even consulted. The URL filter would refuse it as
# well: a CONNECT's URL is "host:port", which never matches ^http://.
ConnectPort 1
