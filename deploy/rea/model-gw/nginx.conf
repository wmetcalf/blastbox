# rea-model-gw: the only holder of the hosted-model credential. The REA sandbox reaches it
# through rea-model-proxy (tinyproxy filter), plain HTTP, one path; this adds the key and
# forwards to OpenRouter over verified TLS. Bodies are never logged.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/cb; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f;
  uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
  client_max_body_size 16m;
  client_body_buffer_size 16m;
  server_tokens off;
  server {
    listen 8080;
    location = /api/v1/chat/completions {
      limit_except POST { deny all; }
      proxy_pass https://openrouter.ai/api/v1/chat/completions;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_ssl_name openrouter.ai;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 4;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_set_header Host openrouter.ai;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Real-IP "";
      proxy_set_header Cookie "";
      proxy_set_header X-Title "loadout-rea";
      include /etc/nginx/secret/auth.conf;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
    location / { return 403; }
  }
}
