name: publish

# Publishes to PyPI via Trusted Publishing (OIDC) when a GitHub Release is
# published. No API token is stored in the repo — configure the trusted
# publisher once on PyPI: project `blastbox`, owner `wmetcalf`, repo
# `blastbox`, workflow `publish.yml`, environment `pypi`.
# https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Don't hard-fail if a file for this version is already on PyPI
          # (e.g. a re-run, or a version uploaded manually via twine).
          skip-existing: true
