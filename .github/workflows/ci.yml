name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[host,dev]"
      - name: Ruff
        # tests/ too, since 2026-08-21. It was carrying 17 violations that `ruff check src`
        # could never see -- the same blind spot RedTusk had. E402 in tests is exempted in
        # pyproject: pytest.importorskip must precede the imports it guards.
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src
      - name: Pytest
        # Firecracker + Postgres suites self-skip without /dev/kvm + a DSN.
        run: pytest -q

  sandbox:
    # The nsjail and bwrap backends' tests skip in the plain `test` job -- neither binary is
    # packaged on the runner, and neither is on the fleet hosts either (they live inside the
    # worker images). That block therefore ran NOWHERE: a regression in the sandbox argv, the
    # seccomp policy wiring or the insecurity reasons would have shipped green. Same reasoning
    # as pg-search below: provide the dependencies and run them for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap and the seccomp binding
        # A venv with --system-site-packages over the DISTRO python, not setup-python: the
        # `seccomp` bindings ship only as a distro package (python3-seccomp), and without them
        # `test_build_bpf_bytes_valid` skips and every real bwrap test forces
        # _LIBSECCOMP_AVAILABLE=False -- so this job could stay green while BPF generation or
        # the real `bwrap --seccomp <fd>` path was broken.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap python3-seccomp python3-venv
          bwrap --version
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -c "import seccomp; print('seccomp binding OK')"
          .venv/bin/pip install -q -e ".[host,dev]"
      - name: Build and install nsjail
        # PINNED TO A COMMIT, not a tag: `git clone --branch` only selects a ref, it verifies
        # nothing, so a moved or recreated tag would have this trusted job build and execute
        # different source with no change here. This SHA is the one that was built and its
        # tests run against locally before the job was written.
        env:
          NSJAIL_COMMIT: f78475530b46d0186111a9096b30725f816b55fe   # tag 3.6
        run: |
          sudo apt-get install -y -q autoconf bison flex gcc g++ git libprotobuf-dev \
            libnl-route-3-dev libtool make pkg-config protobuf-compiler
          git clone -q --filter=blob:none https://github.com/google/nsjail /tmp/nsjail
          git -C /tmp/nsjail checkout -q "$NSJAIL_COMMIT"
          got=$(git -C /tmp/nsjail rev-parse HEAD)
          if [ "$got" != "$NSJAIL_COMMIT" ]; then
            echo "nsjail checkout is $got, expected $NSJAIL_COMMIT" >&2; exit 1
          fi
          git -C /tmp/nsjail submodule update --init --recursive --depth=1
          make -C /tmp/nsjail -j"$(nproc)"
          sudo install -m 0755 /tmp/nsjail/nsjail /usr/local/bin/nsjail
          nsjail --help | head -1
      - name: Grant userns to the sandbox binaries (scoped AppArmor profiles)
        # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1, which blocks the
        # user namespaces both backends need -- so without this the smoke-run tests and the
        # selector tests skip and the job is green having exercised neither. The repo already
        # ships scoped per-binary profiles for exactly this (deploy/apparmor/README.md); they
        # grant `userns` to those binaries only, leaving the host-wide restriction intact.
        run: |
          # EVERY shipped profile, by glob rather than by name: a profile added to
          # deploy/apparmor/ and forgotten here is one nothing ever parses -- which is how
          # blastbox-runsc came to be missing until rootless runsc hit the same restriction.
          for p in deploy/apparmor/blastbox-*; do
            sudo cp "$p" /etc/apparmor.d/
            sudo apparmor_parser -r -W "/etc/apparmor.d/$(basename "$p")"
          done
          # Name AND mode. `aa-status | grep` prints the bare name -- it cannot show the mode,
          # so it cannot verify that these loaded as intended (codex, #161).
          sudo grep -E '^blastbox-' /sys/kernel/security/apparmor/profiles
          # GATE, do not merely report. `... || echo` turns a failed probe into a green step,
          # and pytest then turns the same failure into skips -- so the job created to stop
          # tests skipping silently would itself go green having skipped them. That is the
          # exact failure mode, reintroduced in its own verification (codex, #157).
          #
          # --unshare-all, not just --unshare-user: the operation that actually failed on this
          # runner before the profiles were loaded was the NETWORK namespace
          # ("bwrap: loopback: Failed RTM_NEWADDR"), so a probe without it does not reproduce
          # what the tests need.
          bwrap --unshare-all --unshare-user --uid 0 --ro-bind / / -- /bin/true
          echo "bwrap userns+netns OK"
          # The CHILD profile specifically. The loop above loads it because it matches the
          # glob, but nothing so far PROVES the backends see it -- and without it every
          # assertion about attaching a profile is a mock talking to a mock, while
          # select_sandbox refuses both namespace backends for `apparmor_missing`. Gate on
          # the mode, then on what the product does with it.
          sudo grep -E '^blastbox-sandbox \(enforce\)$' /sys/kernel/security/apparmor/profiles
      - name: The backends actually attach the shipped child profile (not a mock)
        # Every unit test for the attach path monkeypatches _find_aa_exec and
        # _apparmor_enforcing_now, because a developer host rarely has the profile loaded.
        # This runner does. So run the real constructor, the real argv builder and a real
        # detonation, and require the child to come back reporting the profile -- the one
        # assertion in this repo that the whole #160 mechanism works end to end.
        run: |
          set -o pipefail
          .venv/bin/python - <<'PY'
          import sys
          from blastbox.worker.sandbox.base import SandboxRequest
          from blastbox.worker.sandbox.nsjail import NsjailSandbox
          from blastbox.worker.sandbox.bwrap import BubblewrapSandbox

          failures = []
          for sb in (NsjailSandbox(), BubblewrapSandbox()):
              if not sb.apparmor_active:
                  failures.append(f"{sb.name}: did not arm: {sb.insecurity_reasons}")
                  continue
              argv = sb._build_argv(SandboxRequest(argv=["/usr/bin/true"]))
              if "aa-exec" not in " ".join(argv):
                  failures.append(f"{sb.name}: armed but attaches nothing")
              res = sb.run(SandboxRequest(
                  argv=["/bin/sh", "-c", "cat /proc/self/attr/current"]))
              got = res.stdout.decode().strip()
              print(f"{sb.name}: rc={res.exit_code} child profile={got!r}")
              if res.exit_code != 0:
                  failures.append(f"{sb.name}: rc={res.exit_code} {res.stderr[-300:]!r}")
              elif not got.startswith("blastbox-sandbox"):
                  failures.append(f"{sb.name}: child reports {got!r}, not the attached profile")
          if failures:
              print("::error::" + " | ".join(failures))
              sys.exit(1)
          PY
      - name: Pytest (sandbox backends, with nsjail + bwrap present)
        # -rs so the log SAYS which tests skip and why, and then REFUSE any skip that means a
        # backend was not exercised. This job exists to run these tests; a run where they
        # quietly went back to skipping -- a runner image that blocks namespaces again, a
        # dropped dependency -- must fail, not pass with a shorter log. Other skip reasons
        # (a genuinely absent optional feature) stay allowed, so this does not become a
        # tripwire for every future skip.
        run: |
          set -o pipefail
          .venv/bin/pytest -q -rs tests/worker/sandbox/ | tee /tmp/sandbox.txt
          if grep -E "SKIPPED.*(not installed|not usable|probe failed)" /tmp/sandbox.txt; then
            echo "::error::a sandbox backend was not exercised -- see the skips above" >&2
            exit 1
          fi

  grants-enforcement:
    timeout-minutes: 25
    # A PASSING SUITE IS NOT EVIDENCE THAT A CONTROL WORKS. The node-grants gate was
    # twice found to be disableable with every test green, because the tests written for
    # it asserted on `inspect.getsource()` substrings rather than running anything. This
    # job removes the control, one arm at a time, and requires the enforcement matrix to
    # go RED each time. A control the tests cannot notice the absence of is not tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[host,dev]"
      - name: The matrix itself passes
        # BOTH files. This step is the baseline the mutation proof's verdict depends on,
        # and it used to run only the first — so a failure in the libvirt file, which
        # covers six of the mutations, would have gone unnoticed here AND made every
        # mutation report "caught" in the step below.
        run: |
          .venv/bin/python -m pytest \
            tests/host/test_grants_enforcement_matrix.py \
            tests/host/test_libvirt_isolated_default.py -q
      - name: ...and fails without the control it tests
        run: scripts/ci/prove-grants-enforcement.sh

  egress-forwarder-image:
    timeout-minutes: 15
    # The forwarder is a real deployment artifact but it is built on the node, not
    # published to a registry (this repo ships only the PyPI wheel). Nothing would
    # otherwise notice it rotting until an operator ran `egress apply --mode global` on a
    # live node and got a build failure mid-install. Build it here, and assert the
    # behaviours the tier depends on: it must FAIL CLOSED with no reachable upstream, it
    # must refuse to start at all with no upstream configured, and — the one this job was
    # missing — it must print a gate line that `egress.GATE_OK_PATTERN` ACCEPTS when the
    # overlay is fine. Both existing assertions were negative, so the single string the
    # dispatcher's health gate keys on was never produced or matched anywhere in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the forwarder image
        run: docker build -t blastbox-egress-forwarder:ci deploy/egress-forwarder
      - name: It refuses to start with no upstream configured
        run: |
          if docker run --rm blastbox-egress-forwarder:ci; then
            echo "::error::forwarder started without BLASTBOX_UPSTREAM_GW"; exit 1
          fi
      - name: Its startup gate fails closed when the overlay is unreachable
        run: |
          docker run -d --name fwd --cap-add NET_ADMIN \
            -e BLASTBOX_UPSTREAM_GW=192.0.2.1 -e BLASTBOX_GATE_RETRIES=2 \
            blastbox-egress-forwarder:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' fwd)" = "false" ] && break
            sleep 1
          done
          state=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' fwd)
          docker logs fwd
          # Exiting non-zero IS the correct outcome: it leaves the gateway address empty
          # so the worker's default route points nowhere.
          # The exit CODE alone is not proof: entrypoint.sh exits 1 on the uplink-detection
          # path too, before the gate ever runs, so a broken entrypoint would report
          # "fail-closed OK". Require the gate's own message, the same way
          # egress.GATE_OK_PATTERN refuses to judge a forwarder on liveness.
          case "$state" in
            "exited 1") : ;;
            *) echo "::error::expected 'exited 1', got '$state'"; exit 1 ;;
          esac
          if docker logs fwd 2>&1 | grep -q "overlay peer 192.0.2.1 unreachable after"; then
            echo "fail-closed gate OK (the gate ran, retried, and refused)"
          else
            echo "::error::container exited 1 but the startup gate never ran"; exit 1
          fi
      - name: Its gate SUCCESS line is the one the health gate recognises
        run: |
          # A reachable upstream: the container's own bridge gateway always answers.
          UP=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          docker run -d --name fwdok --cap-add NET_ADMIN --sysctl net.ipv4.ip_forward=1 \
            -e BLASTBOX_UPSTREAM_GW="$UP" blastbox-egress-forwarder:ci
          for _ in $(seq 1 30); do
            docker logs fwdok 2>&1 | grep -q 'overlay peer' && break
            sleep 1
          done
          docker logs fwdok > /tmp/fwdok.log 2>&1
          cat /tmp/fwdok.log
          python3 scripts/ci/assert-gate-line.py /tmp/fwdok.log
          docker rm -f fwdok
      - name: Clean up
        if: always()
        run: docker rm -f fwd || true

  pg-search:
    # Perceptual-hash search is Postgres + pg_bktree only — there is no SQLite
    # search path — so its tests skip in the plain `test` job. Build a Postgres
    # image with the extension compiled in and run them against it for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[host,dev]"
      - name: Build pg_bktree Postgres image
        run: docker build -t blastbox-postgres-bktree:ci deploy/docker/postgres
      - name: Start Postgres + pg_bktree
        run: |
          docker run -d --name bbpg \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test \
            -p 5432:5432 blastbox-postgres-bktree:ci
          # pg_isready passes against the bootstrap server BEFORE initdb creates
          # the `test` DB + runs init-bktree.sql, so poll until the extension is
          # actually queryable in `test` (that implies init scripts completed).
          ok=
          for i in $(seq 1 60); do
            if [ "$(docker exec bbpg psql -U test -d test -tAc \
                  "SELECT 1 FROM pg_extension WHERE extname='bktree'" 2>/dev/null)" = "1" ]; then
              echo "postgres + bktree ready after ~$((i*2))s"; ok=1; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "postgres+bktree not ready"; docker logs bbpg | tail -60; exit 1; fi
      - name: Pytest (Postgres + pg_bktree search)
        env:
          BLASTBOX_TEST_PG_DSN: postgresql://test:test@localhost:5432/test
        run: >-
          pytest -q
          tests/host/jobs/test_page_hash_search.py
          tests/host/jobs/test_sql_store.py
          tests/host/ingress/test_similar.py

  profile-gate:
    # blastbox.profile drift-gate: profile a REAL soffice conversion and assert it uses no
    # escape-only syscall and opens no network egress. The tests self-skip without
    # soffice/strace/nono (so they're invisible in the plain `test` job) — here we give it
    # those tools so the gate actually RUNS and catches a dependency bump widening the
    # syscall/network surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install soffice + strace
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libreoffice-writer strace
      - name: Install nono (pinned + sha256)
        run: |
          curl -fsSL -o /tmp/nono.tgz \
            https://github.com/always-further/nono/releases/download/v0.61.1/nono-v0.61.1-x86_64-unknown-linux-gnu.tar.gz
          echo "9186323e1deda74bda886ab57ae3cff820bc85861a9dd691b898a4d309bffa93  /tmp/nono.tgz" | sha256sum -c -
          tar xzf /tmp/nono.tgz -C /tmp && sudo install -D /tmp/nono /usr/local/bin/nono
      - name: Pytest (profile drift-gate)
        run: pytest -q tests/profile -rs
