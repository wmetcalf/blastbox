name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[host,dev]"
      - name: Ruff
        run: ruff check src
      - name: Mypy
        run: mypy src
      - name: Pytest
        # Firecracker + Postgres suites self-skip without /dev/kvm + a DSN.
        run: pytest -q
