name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[host,dev]"
      - name: Ruff
        run: ruff check src
      - name: Mypy
        run: mypy src
      - name: Pytest
        # Firecracker + Postgres suites self-skip without /dev/kvm + a DSN.
        run: pytest -q

  egress-forwarder-image:
    timeout-minutes: 15
    # The forwarder is a real deployment artifact but it is built on the node, not
    # published to a registry (this repo ships only the PyPI wheel). Nothing would
    # otherwise notice it rotting until an operator ran `egress apply --mode global` on a
    # live node and got a build failure mid-install. Build it here, and assert the two
    # behaviours the tier depends on: it must FAIL CLOSED with no reachable upstream, and
    # it must refuse to start at all with no upstream configured.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the forwarder image
        run: docker build -t blastbox-egress-forwarder:ci deploy/egress-forwarder
      - name: It refuses to start with no upstream configured
        run: |
          if docker run --rm blastbox-egress-forwarder:ci; then
            echo "::error::forwarder started without BLASTBOX_UPSTREAM_GW"; exit 1
          fi
      - name: Its startup gate fails closed when the overlay is unreachable
        run: |
          docker run -d --name fwd --cap-add NET_ADMIN \
            -e BLASTBOX_UPSTREAM_GW=192.0.2.1 -e BLASTBOX_GATE_RETRIES=2 \
            blastbox-egress-forwarder:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' fwd)" = "false" ] && break
            sleep 1
          done
          state=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' fwd)
          docker logs fwd
          # Exiting non-zero IS the correct outcome: it leaves the gateway address empty
          # so the worker's default route points nowhere.
          # The exit CODE alone is not proof: entrypoint.sh exits 1 on the uplink-detection
          # path too, before the gate ever runs, so a broken entrypoint would report
          # "fail-closed OK". Require the gate's own message, the same way
          # egress.GATE_OK_PATTERN refuses to judge a forwarder on liveness.
          case "$state" in
            "exited 1") : ;;
            *) echo "::error::expected 'exited 1', got '$state'"; exit 1 ;;
          esac
          if docker logs fwd 2>&1 | grep -q "overlay peer 192.0.2.1 unreachable after"; then
            echo "fail-closed gate OK (the gate ran, retried, and refused)"
          else
            echo "::error::container exited 1 but the startup gate never ran"; exit 1
          fi
      - name: Clean up
        if: always()
        run: docker rm -f fwd || true

  pg-search:
    # Perceptual-hash search is Postgres + pg_bktree only — there is no SQLite
    # search path — so its tests skip in the plain `test` job. Build a Postgres
    # image with the extension compiled in and run them against it for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[host,dev]"
      - name: Build pg_bktree Postgres image
        run: docker build -t blastbox-postgres-bktree:ci deploy/docker/postgres
      - name: Start Postgres + pg_bktree
        run: |
          docker run -d --name bbpg \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test \
            -p 5432:5432 blastbox-postgres-bktree:ci
          # pg_isready passes against the bootstrap server BEFORE initdb creates
          # the `test` DB + runs init-bktree.sql, so poll until the extension is
          # actually queryable in `test` (that implies init scripts completed).
          ok=
          for i in $(seq 1 60); do
            if [ "$(docker exec bbpg psql -U test -d test -tAc \
                  "SELECT 1 FROM pg_extension WHERE extname='bktree'" 2>/dev/null)" = "1" ]; then
              echo "postgres + bktree ready after ~$((i*2))s"; ok=1; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "postgres+bktree not ready"; docker logs bbpg | tail -60; exit 1; fi
      - name: Pytest (Postgres + pg_bktree search)
        env:
          BLASTBOX_TEST_PG_DSN: postgresql://test:test@localhost:5432/test
        run: >-
          pytest -q
          tests/host/jobs/test_page_hash_search.py
          tests/host/jobs/test_sql_store.py
          tests/host/ingress/test_similar.py

  profile-gate:
    # blastbox.profile drift-gate: profile a REAL soffice conversion and assert it uses no
    # escape-only syscall and opens no network egress. The tests self-skip without
    # soffice/strace/nono (so they're invisible in the plain `test` job) — here we give it
    # those tools so the gate actually RUNS and catches a dependency bump widening the
    # syscall/network surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install soffice + strace
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libreoffice-writer strace
      - name: Install nono (pinned + sha256)
        run: |
          curl -fsSL -o /tmp/nono.tgz \
            https://github.com/always-further/nono/releases/download/v0.61.1/nono-v0.61.1-x86_64-unknown-linux-gnu.tar.gz
          echo "9186323e1deda74bda886ab57ae3cff820bc85861a9dd691b898a4d309bffa93  /tmp/nono.tgz" | sha256sum -c -
          tar xzf /tmp/nono.tgz -C /tmp && sudo install -D /tmp/nono /usr/local/bin/nono
      - name: Pytest (profile drift-gate)
        run: pytest -q tests/profile -rs
